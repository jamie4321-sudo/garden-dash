<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AGIT GARDEN · Linkagelab</title>
  <meta name="description" content="AGIT GARDEN — Linkagelab 운영 대시보드" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="css/styles.css?v=20261104k" />
  <link rel="stylesheet" href="css/dash-hello.css?v=20261105b" />
  <link rel="stylesheet" href="css/zones.css?v=20261104k" />
  <link rel="stylesheet" href="css/sla.css?v=20261105j" />
  <link rel="stylesheet" href="css/issue-report.css?v=20261105c" />
</head>
<body>
  <div class="layout">
    <!-- ============ SIDEBAR ============ -->
    <aside class="side" id="side">
      <a class="brand" href="#dashboard">
        <span class="brand__row">
          <img class="brand__icon" src="favicon.svg" alt="" />
          <span class="brand__mark">AGIT GARDEN</span>
        </span>
        <span class="brand__sub">Linkagelab</span>
      </a>

      <nav class="nav" id="nav">
        <p class="nav__label">MAIN</p>
        <a class="nav__item" data-view="dashboard" href="#dashboard">대시보드</a>

        <p class="nav__label">CREW</p>
        <a class="nav__item" data-view="crew" href="#crew">크루 로스터</a>
        <a class="nav__item" data-view="training" href="#training">크루 교육 관리</a>
        <a class="nav__item" data-view="issues" href="#issues">식물 이슈 관리</a>
        <a class="nav__item" data-view="settlement" href="#settlement">운영 정산 관리</a>
        <a class="nav__item" data-view="safety" href="#safety">산업안전보건</a>
        <a class="nav__item nav__item--sub" data-view="heat" href="#heat">체감온도기록</a>
        <a class="nav__item" data-view="plants" href="#plants">식물 상태 점검</a>
        <a class="nav__item" data-view="zones" href="#zones">관리 구역</a>
        <a class="nav__item" data-view="floors" href="#floors">각층 현황</a>
        <a class="nav__item" data-view="swaps" href="#swaps">교체 현황</a>

        <p class="nav__label">OPERATION</p>
        <a class="nav__item" data-view="schedule" href="#schedule">업무스케줄</a>
        <a class="nav__item" data-view="report" href="#report">월간리포트</a>
        <a class="nav__item" data-view="monthly" href="#monthly">월간 리뷰 보드</a>
        <a class="nav__item" data-view="sla" href="#sla">SLA</a>

        <p class="nav__label">SYSTEM</p>
        <a class="nav__item" data-view="settings" href="#settings">설정</a>
      </nav>

      <div class="side__foot">
        <span class="dot"></span>
        <span id="whoami">DEMO · v1.0</span>
        <button class="side__lock" onclick="GARDEN.lock()" title="잠금 (다시 비밀번호 입력)">🔒</button>
      </div>
    </aside>

    <!-- ============ MAIN ============ -->
    <div class="main">
      <header class="topbar">
        <p class="topbar__crumb" id="crumb">MAIN / DASHBOARD</p>
        <div class="topbar__right">
          <div class="search">
            <span>⌕</span>
            <input type="text" placeholder="크루 · 매장 검색" />
            <kbd>/</kbd>
          </div>
          <button class="theme-toggle" id="themeToggle" type="button">
            <span class="knob"></span>
            <span id="themeLabel">DARK</span>
          </button>
        </div>
      </header>

      <main id="app"><!-- views injected here --></main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=20261104k"></script>
  <script src="js/data.js"></script>
  <script src="js/zones.js?v=20261104k"></script>
  <script src="js/sla.js?v=20261105k"></script>
  <script src="js/gardener.js?v=20261104k"></script>
  <script src="js/issue-report.js?v=20261105c"></script>
  <script src="js/app.js?v=20261105c"></script>
</body>
</html>
